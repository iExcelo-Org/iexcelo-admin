name: Frontend =::= Lint & Deploy

# Same file in both frontend repos.
# staging branch -> wrangler.staging.jsonc (staging Worker)
# main branch    -> wrangler.jsonc         (production Worker)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present

  deploy:
    name: Deploy to Cloudflare (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: lint
    # Only the main and staging branches themselves deploy: never PRs or other branches.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name != 'pull_request'
    # GitHub environments hold each environment's settings and can be locked to one branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_CONFIG: ${{ github.ref == 'refs/heads/main' && 'wrangler.jsonc' || 'wrangler.staging.jsonc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Every Variable in this GitHub environment (NEXT_PUBLIC_API_URL and so on) becomes
      # a line in .env.production. Next bakes NEXT_PUBLIC_* values in at build time.
      - name: Write environment file
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production
          echo "Variables written: $(cut -d= -f1 .env.production | tr '\n' ' ')"

      - name: Build
        run: npx opennextjs-cloudflare build --config="$WRANGLER_CONFIG"

      - name: Deploy
        run: npx opennextjs-cloudflare deploy --config="$WRANGLER_CONFIG"
